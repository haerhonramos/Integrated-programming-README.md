<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XMLHttpRequest Lab</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 30px;
      }

      button {
        padding: 10px 15px;
        cursor: pointer;
      }

      #output {
        margin-top: 20px;
        border: 1px solid #ddd;
        padding: 15px;
        min-height: 50px;
      }

      .error {
        color: red;
      }
    </style>
  </head>
  <body>
    <h2>Exploring XMLHttpRequest</h2>

    <button id="loadData">Load Post Data</button>

    <div id="output">Click the button to load post data.</div>

    <script>
      document
        .getElementById("loadData")
        .addEventListener("click", function () {
          const xhr = new XMLHttpRequest();

          const output = document.getElementById("output");

          output.innerHTML = "Loading post data...";

          xhr.onreadystatechange = function () {
            if (xhr.readyState === 4) {
              if (xhr.status === 200) {
                const data = JSON.parse(xhr.responseText);

                output.innerHTML = `
                            <strong>Post Title:</strong><br>
                            ${data.title}
                            <br><br>

                            <strong>Content:</strong><br>
                            ${data.body}
                        `;
              } else {
                output.innerHTML = `
                            <span class="error">
                                Error: ${xhr.status} - ${xhr.statusText}
                            </span>
                        `;
              }
            }
          };

          xhr.onerror = function () {
            output.innerHTML = `
                    <span class="error">
                        Network error. Please check your internet connection.
                    </span>
                `;
          };

          xhr.open("GET", "https://jsonplaceholder.typicode.com/posts/1", true);

          xhr.send();
        });
    </script>
  </body>
</html>
