<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome to Fetch API</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 30px;
      }

      button {
        padding: 10px 15px;
        margin-right: 5px;
        cursor: pointer;
      }

      #output {
        margin-top: 20px;
        border: 1px solid #ccc;
        padding: 15px;
        min-height: 50px;
      }

      .error {
        color: red;
      }

      .success {
        color: green;
      }
    </style>
  </head>

  <body>
    <h2>Welcome to Fetch API</h2>

    <button id="loadData">Load Post Data</button>

    <button id="createPost">Create New Post</button>

    <div id="output">Click a button to display post data.</div>

    <script>
      const output = document.getElementById("output");

      // GET REQUEST
      document
        .getElementById("loadData")
        .addEventListener("click", function () {
          output.innerHTML = "Loading post data...";

          fetch("https://jsonplaceholder.typicode.com/posts/1")
            .then((response) => {
              if (!response.ok) {
                throw new Error("HTTP Error: " + response.status);
              }

              return response.json();
            })

            .then((data) => {
              output.innerHTML = `
                        <strong>Post Title:</strong><br>
                        ${data.title}
                        <br><br>

                        <strong>Content:</strong><br>
                        ${data.body}
                    `;
            })

            .catch((error) => {
              output.innerHTML = `
                        <span class="error">
                            Error: ${error.message}
                        </span>
                    `;
            });
        });

      // POST REQUEST
      document
        .getElementById("createPost")
        .addEventListener("click", function () {
          output.innerHTML = "Creating new post...";

          fetch("https://jsonplaceholder.typicode.com/posts", {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
            },

            body: JSON.stringify({
              title: "My New Post",
              body: "Learning Fetch API is fun!",
              userId: 1,
            }),
          })
            .then((response) => {
              if (!response.ok) {
                throw new Error("HTTP Error: " + response.status);
              }

              return response.json();
            })

            .then((data) => {
              output.innerHTML = `
                    <span class="success">
                        <strong>New Post Created!</strong>
                    </span>
                    <br><br>

                    <strong>Post ID:</strong> ${data.id}
                    <br>

                    <strong>Title:</strong> ${data.title}
                    <br>

                    <strong>Content:</strong> ${data.body}
                `;
            })

            .catch((error) => {
              output.innerHTML = `
                    <span class="error">
                        Error: ${error.message}
                    </span>
                `;
            });
        });
    </script>
  </body>
</html>
